<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>德語單字與數字練習</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --secondary: #10b981;
      --secondary-dark: #059669;
      --orange: #f97316;
      --orange-dark: #ea580c;
      --purple: #8b5cf6;
      --purple-dark: #7c3aed;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #dbe3ef;
      --shadow: rgba(15, 23, 42, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC",
        "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #eff6ff, #ecfdf5);
      color: var(--text);
      min-height: 100vh;
      padding: 18px;
    }

    .app {
      width: 100%;
      max-width: 820px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 18px;
    }

    header h1 {
      margin: 10px 0 6px;
      font-size: 2rem;
      color: #111827;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 18px 0;
    }

    .tab-btn {
      border: 1px solid var(--border);
      background: #ffffff;
      color: var(--text);
      padding: 12px 10px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 12px var(--shadow);
    }

    .tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .section-title {
      margin: 12px 0;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid var(--border);
      border-radius: 14px;
      font-weight: 900;
      color: #111827;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .section-title span {
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 600;
    }

    .card {
      background: var(--card);
      border-radius: 24px;
      padding: 24px 20px;
      box-shadow: 0 12px 32px var(--shadow);
      border: 1px solid var(--border);
      min-height: 420px;
    }

    .badge {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: #e0f2fe;
      color: #0369a1;
      font-size: 0.85rem;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .hidden {
      display: none !important;
    }

    .word {
      font-size: 2.5rem;
      font-weight: 900;
      text-align: center;
      margin: 16px 0 8px;
      color: #111827;
      word-break: break-word;
    }

    .pronunciation {
      text-align: center;
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 16px;
    }

    .meaning-box {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin: 12px 0;
    }

    .meaning {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 12px;
      font-size: 1.05rem;
      line-height: 1.5;
    }

    .meaning strong {
      color: #374151;
    }

    .example {
      margin-top: 16px;
      padding: 14px;
      border-radius: 16px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
    }

    .example .de {
      font-size: 1.12rem;
      font-weight: 800;
      color: #9a3412;
      margin-bottom: 8px;
    }

    .example .zh {
      color: #7c2d12;
      font-size: 0.98rem;
      line-height: 1.5;
    }

    .speak-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .btn {
      border: none;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 900;
      cursor: pointer;
      color: white;
      background: var(--primary);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .btn:hover {
      background: var(--primary-dark);
    }

    .btn.secondary {
      background: var(--secondary);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }

    .btn.secondary:hover {
      background: var(--secondary-dark);
    }

    .btn.gray {
      background: #64748b;
      box-shadow: 0 4px 12px rgba(100, 116, 139, 0.22);
    }

    .btn.orange {
      background: var(--orange);
      box-shadow: 0 4px 12px rgba(249, 115, 22, 0.25);
    }

    .btn.orange:hover {
      background: var(--orange-dark);
    }

    .btn.purple {
      background: var(--purple);
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.25);
    }

    .btn.purple:hover {
      background: var(--purple-dark);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }

    .counter {
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 12px;
    }

    .practice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin: 12px 0 18px;
    }

    .practice-card {
      border: 2px solid transparent;
      background: #f8fafc;
      border-radius: 18px;
      padding: 14px 10px;
      cursor: pointer;
      text-align: center;
      font-weight: 900;
      color: #334155;
    }

    .practice-card small {
      display: block;
      color: var(--muted);
      font-weight: 600;
      margin-top: 5px;
      line-height: 1.4;
    }

    .practice-card.active {
      border-color: var(--primary);
      background: #eff6ff;
      color: #1d4ed8;
    }

    .big-value {
      font-size: 3.2rem;
      font-weight: 950;
      text-align: center;
      margin: 22px 0 8px;
      color: #111827;
      word-break: break-word;
    }

    .german-answer {
      text-align: center;
      font-size: 1.55rem;
      font-weight: 900;
      color: #065f46;
      margin: 12px 0;
      line-height: 1.4;
    }

    .hint {
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-top: 8px;
    }

    .number-options {
      margin-top: 18px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #f9fafb;
    }

    .option-title {
      font-weight: 900;
      margin-bottom: 10px;
      color: #111827;
    }

    .range-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 0.88rem;
      font-weight: 800;
      color: #374151;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 11px 12px;
      font-size: 1rem;
      outline: none;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .list-preview {
      margin-top: 18px;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
    }

    .list-preview h3 {
      margin: 0 0 10px;
      font-size: 1.05rem;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      border: 1px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .chip:hover {
      background: #eff6ff;
      border-color: #93c5fd;
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
      margin: 18px 0 4px;
    }

    @media (max-width: 620px) {
      body {
        padding: 12px;
      }

      header h1 {
        font-size: 1.55rem;
      }

      .tabs {
        grid-template-columns: 1fr;
      }

      .practice-grid {
        grid-template-columns: 1fr;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .speak-row {
        grid-template-columns: 1fr;
      }

      .range-row {
        grid-template-columns: 1fr;
      }

      .word {
        font-size: 2.1rem;
      }

      .big-value {
        font-size: 2.5rem;
      }

      .german-answer {
        font-size: 1.25rem;
      }

      .card {
        padding: 20px 15px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>德語單字與數字練習</h1>
      <p>
        分成「德語單字」與「數字練習」兩個板塊。<br />
        數字練習包含：隨機數字、隨機年份、隨機月份。
      </p>
    </header>

    <div class="tabs">
      <button class="tab-btn active" id="vocabTab" onclick="switchMainSection('vocab')">
        德語單字
      </button>
      <button class="tab-btn" id="practiceTab" onclick="switchMainSection('practice')">
        數字練習
      </button>
    </div>

    <div class="section-title">
      <div id="sectionName">德語單字板塊</div>
      <span id="sectionInfo">共 8 張</span>
    </div>

    <!-- 德語單字板塊 -->
    <main class="card" id="vocabSection">
      <div>
        <div class="badge" id="typeBadge">Verb</div>

        <div class="word" id="word">essen</div>
        <div class="pronunciation" id="pronunciation">德語發音：essen</div>

        <div class="meaning-box">
          <div class="meaning">
            <strong>中文：</strong>
            <span id="chinese">吃</span>
          </div>
          <div class="meaning">
            <strong>英文：</strong>
            <span id="english">to eat</span>
          </div>
        </div>

        <div class="example">
          <div class="de" id="exampleDe">Ich esse Brot.</div>
          <div class="zh" id="exampleZh">我吃麵包。</div>
        </div>
      </div>

      <div>
        <div class="speak-row">
          <button class="btn secondary" onclick="speakVocabWord()">🔊 單字發音</button>
          <button class="btn secondary" onclick="speakVocabExample()">🔊 例句發音</button>
        </div>

        <div class="controls">
          <button class="btn gray" onclick="prevCard()">上一張</button>
          <button class="btn" onclick="randomCard()">隨機單字</button>
          <button class="btn gray" onclick="nextCard()">下一張</button>
        </div>

        <div class="counter" id="counter">第 1 / 8 張</div>
      </div>
    </main>

    <!-- 數字練習板塊 -->
    <main class="card hidden" id="practiceSection">
      <div class="practice-grid">
        <button class="practice-card active" id="modeNumber" onclick="switchPracticeMode('number')">
          隨機數字
          <small>整數，不含小數/分數</small>
        </button>

        <button class="practice-card" id="modeYear" onclick="switchPracticeMode('year')">
          隨機年份
          <small>例如 1998、2024</small>
        </button>

        <button class="practice-card" id="modeMonth" onclick="switchPracticeMode('month')">
          隨機月份
          <small>Januar 到 Dezember</small>
        </button>
      </div>

      <div>
        <div class="badge" id="practiceBadge">隨機數字</div>
        <div class="big-value" id="practiceValue">42</div>
        <div class="german-answer" id="practiceGerman">zweiundvierzig</div>
        <div class="hint" id="practiceHint">
          點擊「產生新的題目」可練習不同整數。
        </div>
      </div>

      <div class="number-options" id="numberOptions">
        <div class="option-title">隨機數字範圍</div>
        <div class="range-row">
          <div>
            <label for="minNumber">最小值</label>
            <input id="minNumber" type="number" value="1" step="1" />
          </div>
          <div>
            <label for="maxNumber">最大值</label>
            <input id="maxNumber" type="number" value="9999" step="1" />
          </div>
        </div>
        <div class="hint">
          只會產生整數，不會產生小數或分數。
        </div>
      </div>

      <div class="speak-row">
        <button class="btn secondary" onclick="speakPractice()">🔊 德語發音</button>
        <button class="btn orange" onclick="generatePractice()">產生新的題目</button>
      </div>
    </main>

    <section class="list-preview" id="previewSection">
      <h3>目前單字列表</h3>
      <div class="chips" id="chips"></div>
    </section>

    <footer>
      German Flashcards for GitHub Pages
    </footer>
  </div>

  <script>
    const vocabCards = [
      {
        word: "essen",
        type: "Verb",
        chinese: "吃",
        english: "to eat",
        exampleDe: "Ich esse Brot.",
        exampleZh: "我吃麵包。"
      },
      {
        word: "trinken",
        type: "Verb",
        chinese: "喝",
        english: "to drink",
        exampleDe: "Ich trinke Wasser.",
        exampleZh: "我喝水。"
      },
      {
        word: "gehen",
        type: "Verb",
        chinese: "走；去",
        english: "to go",
        exampleDe: "Ich gehe zur Schule.",
        exampleZh: "我去學校。"
      },
      {
        word: "kommen",
        type: "Verb",
        chinese: "來",
        english: "to come",
        exampleDe: "Ich komme aus Taiwan.",
        exampleZh: "我來自台灣。"
      },
      {
        word: "lernen",
        type: "Verb",
        chinese: "學習",
        english: "to learn",
        exampleDe: "Ich lerne Deutsch.",
        exampleZh: "我學德文。"
      },
      {
        word: "sprechen",
        type: "Verb",
        chinese: "說",
        english: "to speak",
        exampleDe: "Ich spreche Deutsch.",
        exampleZh: "我說德文。"
      },
      {
        word: "das Buch",
        type: "Nomen",
        chinese: "書",
        english: "book",
        exampleDe: "Das Buch ist interessant.",
        exampleZh: "這本書很有趣。"
      },
      {
        word: "schön",
        type: "Adjektiv",
        chinese: "漂亮的；美好的",
        english: "beautiful",
        exampleDe: "Das Wetter ist schön.",
        exampleZh: "天氣很好。"
      }
    ];

    const months = [
      { value: 1, german: "Januar", chinese: "一月", english: "January" },
      { value: 2, german: "Februar", chinese: "二月", english: "February" },
      { value: 3, german: "März", chinese: "三月", english: "March" },
      { value: 4, german: "April", chinese: "四月", english: "April" },
      { value: 5, german: "Mai", chinese: "五月", english: "May" },
      { value: 6, german: "Juni", chinese: "六月", english: "June" },
      { value: 7, german: "Juli", chinese: "七月", english: "July" },
      { value: 8, german: "August", chinese: "八月", english: "August" },
      { value: 9, german: "September", chinese: "九月", english: "September" },
      { value: 10, german: "Oktober", chinese: "十月", english: "October" },
      { value: 11, german: "November", chinese: "十一月", english: "November" },
      { value: 12, german: "Dezember", chinese: "十二月", english: "December" }
    ];

    let currentMainSection = "vocab";
    let currentVocabIndex = 0;
    let currentPracticeMode = "number";
    let currentPracticeSpeakText = "zweiundvierzig";

    function switchMainSection(section) {
      currentMainSection = section;

      const vocabTab = document.getElementById("vocabTab");
      const practiceTab = document.getElementById("practiceTab");
      const vocabSection = document.getElementById("vocabSection");
      const practiceSection = document.getElementById("practiceSection");
      const previewSection = document.getElementById("previewSection");
      const sectionName = document.getElementById("sectionName");
      const sectionInfo = document.getElementById("sectionInfo");

      if (section === "vocab") {
        vocabTab.classList.add("active");
        practiceTab.classList.remove("active");

        vocabSection.classList.remove("hidden");
        practiceSection.classList.add("hidden");
        previewSection.classList.remove("hidden");

        sectionName.textContent = "德語單字板塊";
        sectionInfo.textContent = "共 " + vocabCards.length + " 張";
        renderVocabCard();
      } else {
        practiceTab.classList.add("active");
        vocabTab.classList.remove("active");

        practiceSection.classList.remove("hidden");
        vocabSection.classList.add("hidden");
        previewSection.classList.add("hidden");

        sectionName.textContent = "數字練習板塊";
        sectionInfo.textContent = "3 種功能";
        generatePractice();
      }
    }

    function renderVocabCard() {
      const card = vocabCards[currentVocabIndex];

      document.getElementById("typeBadge").textContent = card.type;
      document.getElementById("word").textContent = card.word;
      document.getElementById("pronunciation").textContent = "德語發音：" + card.word;
      document.getElementById("chinese").textContent = card.chinese;
      document.getElementById("english").textContent = card.english;
      document.getElementById("exampleDe").textContent = card.exampleDe;
      document.getElementById("exampleZh").textContent = card.exampleZh;
      document.getElementById("counter").textContent =
        "第 " + (currentVocabIndex + 1) + " / " + vocabCards.length + " 張";

      renderChips();
    }

    function nextCard() {
      currentVocabIndex = (currentVocabIndex + 1) % vocabCards.length;
      renderVocabCard();
    }

    function prevCard() {
      currentVocabIndex =
        (currentVocabIndex - 1 + vocabCards.length) % vocabCards.length;
      renderVocabCard();
    }

    function randomCard() {
      if (vocabCards.length <= 1) {
        currentVocabIndex = 0;
      } else {
        let newIndex;
        do {
          newIndex = Math.floor(Math.random() * vocabCards.length);
        } while (newIndex === currentVocabIndex);
        currentVocabIndex = newIndex;
      }
      renderVocabCard();
    }

    function renderChips() {
      const chips = document.getElementById("chips");
      chips.innerHTML = "";

      vocabCards.forEach((card, index) => {
        const chip = document.createElement("button");
        chip.className = "chip";
        chip.textContent = card.word;
        chip.onclick = function () {
          currentVocabIndex = index;
          renderVocabCard();
        };
        chips.appendChild(chip);
      });
    }

    function switchPracticeMode(mode) {
      currentPracticeMode = mode;

      document.getElementById("modeNumber").classList.remove("active");
      document.getElementById("modeYear").classList.remove("active");
      document.getElementById("modeMonth").classList.remove("active");

      if (mode === "number") {
        document.getElementById("modeNumber").classList.add("active");
        document.getElementById("numberOptions").classList.remove("hidden");
      } else if (mode === "year") {
        document.getElementById("modeYear").classList.add("active");
        document.getElementById("numberOptions").classList.add("hidden");
      } else {
        document.getElementById("modeMonth").classList.add("active");
        document.getElementById("numberOptions").classList.add("hidden");
      }

      generatePractice();
    }

    function generatePractice() {
      if (currentPracticeMode === "number") {
        generateRandomNumber();
      } else if (currentPracticeMode === "year") {
        generateRandomYear();
      } else {
        generateRandomMonth();
      }
    }

    function generateRandomNumber() {
      let min = parseInt(document.getElementById("minNumber").value, 10);
      let max = parseInt(document.getElementById("maxNumber").value, 10);

      if (isNaN(min)) min = 1;
      if (isNaN(max)) max = 9999;

      min = Math.trunc(min);
      max = Math.trunc(max);

      if (min > max) {
        const temp = min;
        min = max;
        max = temp;
      }

      const value = getRandomInt(min, max);
      const german = numberToGerman(value);

      document.getElementById("practiceBadge").textContent = "隨機數字";
      document.getElementById("practiceValue").textContent = value.toString();
      document.getElementById("practiceGerman").textContent = german;
      document.getElementById("practiceHint").textContent =
        "整數練習，不包含小數或分數。";

      currentPracticeSpeakText = german;
    }

    function generateRandomYear() {
      const year = getRandomInt(1900, 2099);
      const german = yearToGerman(year);

      document.getElementById("practiceBadge").textContent = "隨機年份";
      document.getElementById("practiceValue").textContent = year.toString();
      document.getElementById("practiceGerman").textContent = german;
      document.getElementById("practiceHint").textContent =
        "年份範圍：1900 到 2099。";

      currentPracticeSpeakText = german;
    }

    function generateRandomMonth() {
      const month = months[getRandomInt(0, months.length - 1)];

      document.getElementById("practiceBadge").textContent = "隨機月份";
      document.getElementById("practiceValue").textContent =
        month.value + " 月";
      document.getElementById("practiceGerman").textContent =
        month.german + " ｜ " + month.chinese + " ｜ " + month.english;
      document.getElementById("practiceHint").textContent =
        "月份可搭配介詞 im 使用，例如：im " + month.german + "。";

      currentPracticeSpeakText = month.german;
    }

    function getRandomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function numberToGerman(num) {
      if (num === 0) return "null";

      if (num < 0) {
        return "minus " + numberToGerman(Math.abs(num));
      }

      const ones = [
        "",
        "eins",
        "zwei",
        "drei",
        "vier",
        "fünf",
        "sechs",
        "sieben",
        "acht",
        "neun"
      ];

      const onesCompound = [
        "",
        "ein",
        "zwei",
        "drei",
        "vier",
        "fünf",
        "sechs",
        "sieben",
        "acht",
        "neun"
      ];

      const teens = {
        10: "zehn",
        11: "elf",
        12: "zwölf",
        13: "dreizehn",
        14: "vierzehn",
        15: "fünfzehn",
        16: "sechzehn",
        17: "siebzehn",
        18: "achtzehn",
        19: "neunzehn"
      };

      const tens = {
        20: "zwanzig",
        30: "dreißig",
        40: "vierzig",
        50: "fünfzig",
        60: "sechzig",
        70: "siebzig",
        80: "achtzig",
        90: "neunzig"
      };

      if (num < 10) {
        return ones[num];
      }

      if (num < 20) {
        return teens[num];
      }

      if (num < 100) {
        const ten = Math.floor(num / 10) * 10;
        const one = num % 10;

        if (one === 0) {
          return tens[ten];
        }

        return onesCompound[one] + "und" + tens[ten];
      }

      if (num < 1000) {
        const hundred = Math.floor(num / 100);
        const rest = num % 100;

        let result = hundred === 1 ? "einhundert" : onesCompound[hundred] + "hundert";

        if (rest > 0) {
          result += numberToGerman(rest);
        }

        return result;
      }

      if (num < 1000000) {
        const thousand = Math.floor(num / 1000);
        const rest = num % 1000;

        let result = "";

        if (thousand === 1) {
          result = "eintausend";
        } else {
          result = numberToGerman(thousand) + "tausend";
        }

        if (rest > 0) {
          result += numberToGerman(rest);
        }

        return result;
      }

      return num.toString();
    }

    function yearToGerman(year) {
      if (year >= 1100 && year <= 1999) {
        const firstPart = Math.floor(year / 100);
        const lastPart = year % 100;

        if (lastPart === 0) {
          return numberToGerman(firstPart) + "hundert";
        }

        return numberToGerman(firstPart) + "hundert" + numberToGerman(lastPart);
      }

      return numberToGerman(year);
    }

    function speak(text) {
      if (!("speechSynthesis" in window)) {
        return;
      }

      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "de-DE";
      utterance.rate = 0.85;
      utterance.pitch = 1;

      window.speechSynthesis.speak(utterance);
    }

    function speakVocabWord() {
      const card = vocabCards[currentVocabIndex];
      speak(card.word);
    }

    function speakVocabExample() {
      const card = vocabCards[currentVocabIndex];
      speak(card.exampleDe);
    }

    function speakPractice() {
      speak(currentPracticeSpeakText);
    }

    renderVocabCard();
  </script>
</body>
